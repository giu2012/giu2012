<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">GIU — Developer</title>
  <desc id="desc">Local AI, systems, automation and native software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset=".48" stop-color="#080D1D"/>
      <stop offset="1" stop-color="#12091C"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset=".22" stop-color="#3B82F6"/>
      <stop offset=".48" stop-color="#8B5CF6"/>
      <stop offset=".74" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="greenCyan" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset=".5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="g1"><stop stop-color="#00E5FF" stop-opacity=".28"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop stop-color="#8B5CF6" stop-opacity=".25"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop stop-color="#EC4899" stop-opacity=".20"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1200" height="400" rx="30"/></clipPath>
  </defs>

  <rect width="1200" height="400" rx="30" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <circle cx="1010" cy="100" r="190" fill="url(#g1)" filter="url(#blur)"/>
    <circle cx="900" cy="300" r="190" fill="url(#g2)" filter="url(#blur)"/>
    <circle cx="1130" cy="315" r="150" fill="url(#g3)" filter="url(#blur)"/>

    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200" stroke="#ffffff" stroke-opacity=".028"/>
    <path d="M100 0V400M250 0V400M400 0V400M550 0V400M700 0V400M850 0V400M1000 0V400M1150 0V400" stroke="#ffffff" stroke-opacity=".02"/>

    <path d="M620 320 C720 255 770 310 850 246 S1010 150 1200 206" fill="none" stroke="url(#spectrum)" stroke-width="3" stroke-linecap="round" opacity=".95"/>
    <path d="M620 350 C740 285 790 345 875 278 S1035 210 1200 260" fill="none" stroke="url(#greenCyan)" stroke-width="1.7" stroke-linecap="round" opacity=".65"/>
    <path d="M690 285 C770 220 830 272 895 215 S1050 120 1170 160" fill="none" stroke="url(#spectrum)" stroke-width="1.3" opacity=".45"/>

    <circle cx="850" cy="246" r="5" fill="#00E5FF" filter="url(#glow)">
      <animate attributeName="r" values="3;7;3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1008" cy="174" r="4" fill="#EC4899" filter="url(#glow)">
      <animate attributeName="r" values="3;6;3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1114" cy="190" r="3.5" fill="#F97316" filter="url(#glow)">
      <animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <text x="76" y="78" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3">GIU / SOFTWARE ENGINEERING</text>
    <rect x="76" y="99" width="86" height="4" rx="2" fill="url(#spectrum)"/>
    <text x="76" y="176" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="700" letter-spacing="-5">GIU</text>
    <text x="80" y="214" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2.5">LOCAL AI · SYSTEMS · AUTOMATION</text>
    <text x="80" y="246" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1.2">PYTHON  ·  C++  ·  TYPESCRIPT  ·  SWIFT  ·  CLI  ·  NATIVE</text>

    <circle cx="760" cy="95" r="34" fill="none" stroke="#00E5FF" stroke-opacity=".35"/>
    <circle cx="760" cy="95" r="21" fill="none" stroke="#8B5CF6" stroke-opacity=".5"/>
    <circle cx="760" cy="95" r="7" fill="url(#spectrum)" filter="url(#glow)"/>
    <text x="810" y="100" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">LOCAL-FIRST</text>
    <text x="810" y="121" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="11">models · agents · tooling</text>

    <circle cx="760" cy="170" r="34" fill="none" stroke="#8B5CF6" stroke-opacity=".38"/>
    <circle cx="760" cy="170" r="21" fill="none" stroke="#EC4899" stroke-opacity=".5"/>
    <circle cx="760" cy="170" r="7" fill="url(#spectrum)" filter="url(#glow)"/>
    <text x="810" y="175" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">AGENT SYSTEMS</text>
    <text x="810" y="196" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="11">orchestration · execution · CLI</text>

    <circle cx="760" cy="245" r="34" fill="none" stroke="#22C55E" stroke-opacity=".4"/>
    <circle cx="760" cy="245" r="21" fill="none" stroke="#00E5FF" stroke-opacity=".5"/>
    <circle cx="760" cy="245" r="7" fill="url(#greenCyan)" filter="url(#glow)"/>
    <text x="810" y="250" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">AUTOMATION</text>
    <text x="810" y="271" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="11">workflows · integrations · tooling</text>

    <circle cx="760" cy="320" r="34" fill="none" stroke="#F97316" stroke-opacity=".35"/>
    <circle cx="760" cy="320" r="21" fill="none" stroke="#EC4899" stroke-opacity=".45"/>
    <circle cx="760" cy="320" r="7" fill="url(#spectrum)" filter="url(#glow)"/>
    <text x="810" y="325" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">NATIVE SOFTWARE</text>
    <text x="810" y="346" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="11">Apple · interfaces · system tools</text>

    <text x="1118" y="72" text-anchor="end" fill="#A5B4FC" fill-opacity=".55" font-family="monospace" font-size="10" letter-spacing="2">BUILD / TEST / DOCUMENT</text>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="398.5" rx="29.25" fill="none" stroke="url(#spectrum)" stroke-opacity=".42"/>
</svg>