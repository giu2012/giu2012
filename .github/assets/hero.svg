<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">GIU — Developer</title>
  <desc id="desc">Developer focused on local AI, systems, automation and native software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".45" stop-color="#0b1024"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset=".33" stop-color="#3B82F6"/>
      <stop offset=".68" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset=".35" stop-color="#00E5FF"/>
      <stop offset=".7" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".25"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".24"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow">
      <stop offset="0" stop-color="#EC4899" stop-opacity=".18"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="400" rx="30"/></clipPath>
  </defs>

  <rect width="1200" height="400" rx="30" fill="url(#bg)"/>

  <g clip-path="url(#round)">
    <circle cx="1040" cy="110" r="190" fill="url(#cyanGlow)" filter="url(#blur)"/>
    <circle cx="930" cy="300" r="180" fill="url(#purpleGlow)" filter="url(#blur)"/>
    <circle cx="1150" cy="330" r="150" fill="url(#pinkGlow)" filter="url(#blur)"/>

    <path d="M0 78H1200M0 160H1200M0 242H1200M0 324H1200" stroke="#ffffff" stroke-opacity=".035"/>
    <path d="M110 0V400M260 0V400M410 0V400M560 0V400M710 0V400M860 0V400M1010 0V400M1160 0V400" stroke="#ffffff" stroke-opacity=".025"/>

    <rect x="52" y="52" width="1096" height="296" rx="24" fill="#ffffff" fill-opacity=".018" stroke="#ffffff" stroke-opacity=".10"/>

    <rect x="76" y="78" width="74" height="4" rx="2" fill="url(#accent)"/>
    <text x="76" y="148" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="700" letter-spacing="-4">GIU</text>

    <text x="79" y="190" fill="#DCEBFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2.8">DEVELOPER · LOCAL AI · SYSTEMS</text>
    <text x="79" y="222" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1.25">PYTHON  /  C++  /  TYPESCRIPT  /  SWIFT  /  AUTOMATION</text>

    <g transform="translate(78 258)">
      <rect width="128" height="34" rx="17" fill="#00E5FF" fill-opacity=".10" stroke="#00E5FF" stroke-opacity=".35"/>
      <circle cx="18" cy="17" r="5" fill="#00E5FF"/>
      <text x="31" y="22" fill="#D9FBFF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">LOCAL AI</text>

      <rect x="140" width="124" height="34" rx="17" fill="#8B5CF6" fill-opacity=".11" stroke="#8B5CF6" stroke-opacity=".38"/>
      <circle cx="158" cy="17" r="5" fill="#A78BFA"/>
      <text x="171" y="22" fill="#F0E9FF" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">AGENTS</text>

      <rect x="276" width="138" height="34" rx="17" fill="#22C55E" fill-opacity=".10" stroke="#22C55E" stroke-opacity=".35"/>
      <circle cx="294" cy="17" r="5" fill="#22C55E"/>
      <text x="307" y="22" fill="#E3FCEB" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">AUTOMATION</text>

      <rect x="426" width="138" height="34" rx="17" fill="#F97316" fill-opacity=".10" stroke="#F97316" stroke-opacity=".38"/>
      <circle cx="444" cy="17" r="5" fill="#F97316"/>
      <text x="457" y="22" fill="#FFF0E6" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">NATIVE APPS</text>
    </g>

    <g transform="translate(760 92)">
      <rect width="330" height="218" rx="22" fill="#020617" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".10"/>
      <circle cx="24" cy="22" r="5" fill="#FF5F57"/>
      <circle cx="43" cy="22" r="5" fill="#FEBC2E"/>
      <circle cx="62" cy="22" r="5" fill="#28C840"/>
      <text x="86" y="26" fill="#64748B" font-family="monospace" font-size="10">giu@local-ai ~ %</text>

      <text x="24" y="64" fill="#22C55E" font-family="monospace" font-size="14">$</text>
      <text x="40" y="64" fill="#F8FAFC" font-family="monospace" font-size="14">build --local --fast</text>

      <rect x="24" y="82" width="280" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="24" y="82" width="234" height="7" rx="3.5" fill="url(#accent)"/>

      <text x="24" y="119" fill="#38BDF8" font-family="monospace" font-size="12">local-ai</text>
      <text x="104" y="119" fill="#94A3B8" font-family="monospace" font-size="12">ready</text>

      <text x="24" y="145" fill="#A78BFA" font-family="monospace" font-size="12">agents</text>
      <text x="104" y="145" fill="#94A3B8" font-family="monospace" font-size="12">online</text>

      <text x="24" y="171" fill="#22C55E" font-family="monospace" font-size="12">status</text>
      <text x="104" y="171" fill="#F8FAFC" font-family="monospace" font-size="12">OPERATIONAL</text>

      <rect x="24" y="190" width="282" height="1" fill="url(#accent2)" opacity=".8"/>
    </g>

    <path d="M706 335C810 250 856 310 942 238S1080 184 1200 236" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity=".9"/>
    <path d="M710 355C810 282 864 333 955 270S1095 240 1200 278" fill="none" stroke="url(#accent2)" stroke-width="1.6" opacity=".6"/>
    <circle cx="942" cy="238" r="5" fill="#00E5FF" filter="url(#soft)"/>
    <circle cx="1062" cy="206" r="4" fill="#EC4899" filter="url(#soft)"/>

    <text x="1114" y="74" text-anchor="end" fill="#A5B4FC" fill-opacity=".55" font-family="monospace" font-size="10" letter-spacing="2">LOCAL-FIRST</text>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="398.5" rx="29.25" fill="none" stroke="url(#accent)" stroke-opacity=".35"/>
</svg>